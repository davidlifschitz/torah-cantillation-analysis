name: CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'uv.lock']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.10.0
      - name: Install locked environment when available
        run: |
          if [ -f uv.lock ]; then uv sync --locked --extra dev; else uv sync --extra dev; fi
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m compileall -q src scripts
